# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Advisory reviews only. Billing and GitHub required checks are controlled outside YAML.
inheritance: false
early_access: false
reviews:
  profile: "quiet"
  request_changes_workflow: false
  review_progress: false
  commit_status: false
  fail_commit_status: false
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^integration$"
  path_filters:
    - "!**/*.lock"
    - "!**/*.lockb"
    - "!**/package-lock.json"
    - "!**/npm-shrinkwrap.json"
    - "!**/pnpm-lock.yaml"
    - "!**/yarn.lock"
    - "!**/composer.lock"
    - "!**/Gemfile.lock"
    - "!**/Pipfile.lock"
    - "!**/Cargo.lock"
    - "!**/go.sum"
    - "!**/packages.lock.json"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/out/**"
    - "!**/coverage/**"
    - "!**/.next/**"
    - "!**/.expo/**"
    - "!**/.turbo/**"
    - "!**/generated/**"
    - "!**/_generated/**"
    - "!**/__generated__/**"
    - "!**/*.generated.*"
    - "!**/*.gen.*"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/*.map"
    - "!**/*.tsbuildinfo"
    - "!docs/design/**/export*"
    - "!docs/design/**/export*/**"
    - "!**/*.{png,jpg,jpeg,gif,webp,avif,ico,bmp,tif,tiff,heic,svg,pdf,woff,woff2,ttf,otf,eot,mp3,mp4,m4a,wav,ogg,flac,aac,webm,mov,avi,zip,gz,tgz,bz2,xz,7z,rar,exe,dll,so,dylib,wasm,bin,pyc,glb,blend,psd,sketch,fig}"
  path_instructions:
    -
      path: "**/*"
      instructions: "Never print, quote, log, or reproduce a secret value or any prefix, suffix, or fragment in review comments, suggestions, patches, logs, or examples. Identify a finding by file, line, and variable name only; use NAME = SET or NAME = UNSET when reporting status. Do not suggest revealing masked credentials. Crisis handling must remain model-independent. Flag any change that makes crisis detection, escalation, or support availability depend on a particular model or provider, a model response, or model availability."
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    custom: []
chat:
  auto_reply: false
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      -
        files: "AGENTS.md,docs/HARD_RULES.md"
        applyTo: "**/*"
  mcp:
    usage: "disabled"
issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false
    auto_planning:
      enabled: false
