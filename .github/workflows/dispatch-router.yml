# .github/workflows/dispatch-router.yml
# Dispatch router: a human adds the label "ready" to an issue -> pick a lane -> start that lane's agent.
#
# Lane rule (first match wins):
#   1. Labels:  area:ui | area:frontend                       -> cursor
#               area:convex | area:backend | area:auth | area:tests -> claude
#               area:ci | area:docs | area:refactor            -> codex
#   2. Else the ticket's MUTATES (or SCOPE) paths in the issue body:
#               convex/**, *auth*, *.test.*, *.spec.*, tests/** -> claude
#               *.tsx, *.css, components/**, app/**, pages/**   -> cursor
#               .github/**, docs/**, *.md                       -> codex
#   3. No match -> no dispatch; the router comments asking for an area: label.
#
# Usage limits: scripts/factory/lane-limits.mjs re-checks the picked lane (FACTORY_*_AT_LIMIT, FACTORY_AGENT_PREFERENCE);
# an agent at its limit is replaced by the next available one; all three at their limit -> agent:freebuff (then
# agent:opencode) + needs:manual-run, run by hand. docs/factory/AGENT-LIMITS.md.
# Guards: the person who applied `ready` must have write/maintain/admin on the repo (triage is not
# enough), and nothing dispatches on Friday or Saturday (Asia/Jerusalem), per the cloud-agent policy.
# Capacity: max 2 running tickets per lane per repo (claude, cursor). "Running" = open issue labeled
# dispatched:<lane> with no linked merged PR. Over capacity -> label queued:<lane>, no run.
# If a lane job fails, it removes dispatched:<lane> so a failed start never holds a slot.
# Codex has no automatic start, so it gets handoff:codex (not counted as running).
# Output: label dispatched:<lane> + a comment with the lane and why.
#
# Lane triggers (see PHASE-B-REPORT Addendum for doc links):
#   claude - runs anthropics/claude-code-action in this job with a `prompt` (automation mode).
#            A bot-posted "@claude" comment would be ignored (claude.yml skips bots), so no comment trigger.
#            Needs secret CLAUDE_CODE_OAUTH_TOKEN. The action re-checks the labeler has write access.
#   cursor - Cursor Cloud Agents API POST https://api.cursor.com/v1/agents. Needs secret CURSOR_API_KEY
#            and repo variable CURSOR_MODEL_ID (explicit model pin required by policy; no default model).
#   codex  - no documented way for a workflow/bot to start Codex cloud on an issue; the router only
#            labels + comments and a maintainer writes "@codex ..." (Codex GitHub app, ChatGPT plan).
# Security: issue title/body are never interpolated into shell; they go through env + jq only.
name: Dispatch router

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  quiet:
    # Quiet hours (factory/LOOP.md): 22:00-09:00 Asia/Jerusalem nothing new starts; the run ends green.
    if: github.event.label.name == 'ready' && github.event.sender.type != 'Bot'
    uses: ./.github/workflows/factory-quiet-hours.yml
    with:
      what: "dispatch-router #${{ github.event.issue.number }} (lane start)"
  route:
    needs: quiet
    if: needs.quiet.outputs.quiet != 'true' && github.event.label.name == 'ready' && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: dispatch-router-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      lane: ${{ steps.pick.outputs.lane }}
    steps:
      - name: Checkout lane-limits script (default branch, no credentials)
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          sparse-checkout: scripts/factory
          persist-credentials: false
      - name: Pick lane, enforce capacity, label and comment
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          LABELS_JSON: ${{ toJSON(github.event.issue.labels.*.name) }}
          BODY: ${{ github.event.issue.body }}
          SENDER: ${{ github.event.sender.login }}
          MAX_PER_LANE: "2"
          # Usage limits + preference (scripts/factory/lane-limits.mjs, docs/factory/AGENT-LIMITS.md).
          FACTORY_CLAUDE_AT_LIMIT: ${{ vars.FACTORY_CLAUDE_AT_LIMIT }}
          FACTORY_CODEX_AT_LIMIT: ${{ vars.FACTORY_CODEX_AT_LIMIT }}
          FACTORY_CURSOR_AT_LIMIT: ${{ vars.FACTORY_CURSOR_AT_LIMIT }}
          FACTORY_AGENT_PREFERENCE: ${{ vars.FACTORY_AGENT_PREFERENCE }}
        run: |
          set -euo pipefail
          perm=$(gh api "repos/$REPO/collaborators/$SENDER/permission" --jq .permission 2>/dev/null || echo none)
          case "$perm" in admin|maintain|write) ;; *)
            gh issue comment "$ISSUE" -R "$REPO" --body "Dispatch router: \`ready\` was applied by someone without write access ($perm). Not dispatched."
            echo "lane=" >> "$GITHUB_OUTPUT"; exit 0;; esac
          dow=$(TZ=Asia/Jerusalem date +%u)
          if [ "$dow" = 5 ] || [ "$dow" = 6 ]; then
            gh issue comment "$ISSUE" -R "$REPO" --body "Dispatch router: no agent runs on Friday or Saturday (Asia/Jerusalem). Re-apply \`ready\` on Sunday."
            echo "lane=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          has() { printf '%s' "$LABELS_JSON" | jq -e --arg l "$1" 'index($l) != null' >/dev/null; }
          lane=""; why=""
          for l in area:ui area:frontend; do has "$l" && { lane=cursor; why="label $l"; break; }; done
          [ -z "$lane" ] && for l in area:convex area:backend area:auth area:tests; do has "$l" && { lane=claude; why="label $l"; break; }; done
          [ -z "$lane" ] && for l in area:ci area:docs area:refactor; do has "$l" && { lane=codex; why="label $l"; break; }; done
          if [ -z "$lane" ]; then
            # Paths listed under a MUTATES: or SCOPE: line/section of the ticket body.
            paths=$(printf '%s\n' "${BODY:-}" | awk '/^[#* ]*(MUTATES|SCOPE)([*: ]|$)/{f=1} f&&/^[#]+ /&&!/(MUTATES|SCOPE)/{f=0} f' | grep -oE '[A-Za-z0-9_./*@-]+/[A-Za-z0-9_./*@-]*|[A-Za-z0-9_.*-]+\.[a-z]{1,5}' || true)
            if printf '%s\n' "$paths" | grep -qiE '(^|/)convex/|auth|\.test\.|\.spec\.|(^|/)tests?/'; then lane=claude; why="MUTATES/SCOPE paths (convex/auth/tests)"
            elif printf '%s\n' "$paths" | grep -qiE '\.tsx$|\.css$|(^|/)(components|app|pages)/'; then lane=cursor; why="MUTATES/SCOPE paths (UI)"
            elif printf '%s\n' "$paths" | grep -qiE '(^|/)\.github/|(^|/)docs/|\.md$'; then lane=codex; why="MUTATES/SCOPE paths (CI/docs)"
            fi
          fi
          if [ -z "$lane" ]; then
            gh issue comment "$ISSUE" -R "$REPO" --body "Dispatch router: no lane matched. Add one area: label (area:ui, area:frontend, area:convex, area:backend, area:auth, area:tests, area:ci, area:docs, area:refactor) or list MUTATES paths, then re-apply \`ready\`."
            echo "lane=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Usage limits: an agent at its limit (FACTORY_*_AT_LIMIT) gets nothing new; fall back in FACTORY_AGENT_PREFERENCE
          # order; claude, codex and cursor all at their limit -> Freebuff, then OpenCode (manual run, labels only), then
          # blocked:amit. Never a pay-per-use agent.
          res=$(node scripts/factory/lane-limits.mjs --want "$lane")
          new_lane=$(printf '%s\n' "$res" | sed -n 's/^lane=//p')
          manual=$(printf '%s\n' "$res" | sed -n 's/^manual=//p')
          add_labels=$(printf '%s\n' "$res" | sed -n 's/^labels=//p')
          reason=$(printf '%s\n' "$res" | sed -n 's/^reason=//p')
          if [ "$manual" = true ] || [ -z "$new_lane" ]; then
            IFS=, read -ra fl <<< "$add_labels"
            for l in "${fl[@]}"; do gh label create "$l" -R "$REPO" --color FBCA04 --force >/dev/null; gh issue edit "$ISSUE" -R "$REPO" --add-label "$l"; done
            gh issue comment "$ISSUE" -R "$REPO" --body "Dispatch router: $reason. Nothing started; see docs/factory/AGENT-LIMITS.md."
            echo "::notice title=Usage limits::#$ISSUE -> $add_labels"
            echo "lane=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$new_lane" != "$lane" ]; then why="$why; $reason"; lane="$new_lane"; fi

          if [ "$lane" = codex ]; then
            gh label create "handoff:codex" -R "$REPO" --color BFD4F2 --force >/dev/null
            gh issue edit "$ISSUE" -R "$REPO" --add-label "handoff:codex"
            gh issue comment "$ISSUE" -R "$REPO" --body "Dispatch router: lane **codex** because $why. Not started automatically; see the next comment."
            echo "lane=codex" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Capacity: open issues with dispatched:<lane> and no linked merged PR.
          owner="${REPO%/*}"; name="${REPO#*/}"
          running=$(gh api graphql -F owner="$owner" -F name="$name" -f label="dispatched:$lane" -f query='
            query($owner:String!,$name:String!,$label:String!){repository(owner:$owner,name:$name){
              issues(first:50,states:OPEN,labels:[$label]){nodes{number
                closedByPullRequestsReferences(first:10,includeClosedPrs:true){nodes{merged}}}}}}' \
            --jq "[.data.repository.issues.nodes[] | select(.number != $ISSUE) | select([.closedByPullRequestsReferences.nodes[].merged] | any | not)] | length")
          for l in "dispatched:$lane" "queued:$lane"; do gh label create "$l" -R "$REPO" --color BFD4F2 --force >/dev/null; done
          if [ "$running" -ge "$MAX_PER_LANE" ]; then
            gh issue edit "$ISSUE" -R "$REPO" --add-label "queued:$lane"
            gh issue comment "$ISSUE" -R "$REPO" --body "Dispatch router: lane **$lane** ($why) is full ($running/$MAX_PER_LANE running). Queued; re-apply \`ready\` when a slot frees up."
            echo "lane=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          gh issue edit "$ISSUE" -R "$REPO" --add-label "dispatched:$lane"
          gh issue comment "$ISSUE" -R "$REPO" --body "Dispatch router: lane **$lane** because $why. Running in this lane: $((running+1))/$MAX_PER_LANE. Limits: 30 min per job; Claude max 40 turns."
          echo "lane=$lane" >> "$GITHUB_OUTPUT"

  claude:
    needs: route
    if: needs.route.outputs.lane == 'claude'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout integration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          ref: integration
      - name: Set up Bun (the ticket's DONE commands use bun)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"
      - name: Install dependencies (so the agent can run the ticket's tests)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install command wrappers and create the agent branch
        env:
          ISSUE: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git() { /usr/bin/git -c core.hooksPath=/dev/null "$@"; }
          case "$ISSUE" in
            ''|*[!0-9]*) echo "::error::issue number is not digits"; exit 1 ;;
          esac
          # Same group as agent-router. If claude/issue-<number> already exists,
          # continue on it so a later run fast-forwards instead of diverging.
          # Wrappers live on integration. master does not have them until Amit
          # merges, and the checkout ref must not be the source of these blobs.
          TRUSTED_REF=integration
          case "$TRUSTED_REF" in
            ''|-*|*..*|*:*|*[!A-Za-z0-9._/-]*) echo "::error::trusted ref is not allowed"; exit 1 ;;
          esac
          git fetch --depth=1 origin "$TRUSTED_REF"
          # Install as root and drop the write bit. A scratch-file symlink must
          # not be able to replace these, and the model must not be able to
          # write over them either. rm removes a symlink; it does not follow it.
          sudo -n mkdir -p /usr/local/bin /usr/local/lib
          for tool in tempo-safe-git tempo-safe-bun tempo-write-scratch; do
            sudo -n rm -f "/usr/local/bin/${tool}"
            git show "origin/${TRUSTED_REF}:.github/scripts/${tool}" | sudo -n tee "/usr/local/bin/${tool}" >/dev/null
            sudo -n chown root:root "/usr/local/bin/${tool}"
            sudo -n chmod 0555 "/usr/local/bin/${tool}"
            sudo -n chattr +i "/usr/local/bin/${tool}" || true
          done
          case "$REPO" in
            [A-Za-z0-9._-]*/[A-Za-z0-9._-]*) ;;
            *) echo "::error::repository name is not allowed"; exit 1 ;;
          esac
          printf '%s\n' "https://github.com/${REPO}.git" | sudo -n tee /usr/local/lib/tempo-git-origin >/dev/null
          # checkout@v6 keeps the token in an included file as a URL-scoped
          # extraheader. A local get of the unscoped key misses it.
          # --get-urlmatch follows that include. Do not print the value.
          header=$(git config --get-urlmatch http.extraheader "https://github.com/${REPO}.git" || true)
          case "$header" in
            *'['*|*']'*|*$'\n'*) echo "::error::http.extraheader is not a single safe line"; exit 1 ;;
          esac
          if [ -z "$header" ]; then
            echo "::error::checkout credential was not found"
            exit 1
          fi
          printf '%s' "$header" | sudo -n tee /usr/local/lib/tempo-git-extraheader >/dev/null
          sudo -n chown root:root /usr/local/lib/tempo-git-origin /usr/local/lib/tempo-git-extraheader
          sudo -n chmod 0444 /usr/local/lib/tempo-git-origin
          # 0400 root: the model can Read a 0444 file. The workflow push step
          # reads this with sudo after the model has exited. Do not print it.
          sudo -n chmod 0400 /usr/local/lib/tempo-git-extraheader
          sudo -n chattr +i /usr/local/lib/tempo-git-origin /usr/local/lib/tempo-git-extraheader || true
          unset header
          BRANCH="claude/issue-${ISSUE}"
          git fetch --depth=1 origin "$BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}"; then
            git checkout -B "$BRANCH" "origin/${BRANCH}"
          else
            git checkout -b "$BRANCH"
          fi
          # Write after checkout, outside the work tree. rm -f only drops a
          # leftover in-repo symlink; the body goes through tempo-write-scratch
          # (O_NOFOLLOW|O_EXCL) so a recreated symlink is not followed.
          rm -f .tempo-issue.md
          gh issue view "$ISSUE" --repo "$REPO" --comments | /usr/local/bin/tempo-write-scratch "${RUNNER_TEMP}/tempo-issue.md"
          # Checkout's includeIf file is still runner-readable. Lock it, then
          # drop includeIf from .git/config before the model starts.
          # checkout@v6 writes a host includeIf for the gitdir AND one for
          # gitdir/worktrees/*, both pointing at the same credentials file.
          # Lock each file once: after chattr +i, a second chown gets EPERM.
          locked=' '
          while read -r _key path; do
            [ -n "${path:-}" ] || continue
            case "$locked" in *" ${path} "*) continue ;; esac
            # checkout@v6 also records /github/runner_temp/... for container
            # jobs. That path is absent on the host runner. Skip it. An
            # existing file outside the temp dirs still fails the step.
            if [ ! -e "$path" ]; then
              continue
            fi
            case "$path" in
              "${RUNNER_TEMP:-/tmp}"/*|/home/runner/*|/tmp/*|/github/runner_temp/*) ;;
              *) echo "::error::refusing to lock unexpected credential path"; exit 1 ;;
            esac
            if [ -f "$path" ] && [ ! -L "$path" ]; then
              sudo -n chown root:root "$path"
              sudo -n chmod 0400 "$path"
              sudo -n chattr +i "$path" || true
              locked="${locked}${path} "
            fi
          done < <(git config --local --get-regexp '^includeIf\.' || true)
          /usr/local/bin/tempo-safe-git status >/dev/null
      - name: Run Claude Code on the ticket
        id: claude_code
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No track_progress: on issue events it forces tag mode, whose built-in prompt only
          # posts a manual "Create a PR" link (proof run #496, 2 Oct). Automation mode runs this
          # prompt. A later step opens a draft PR with DISPATCH_PAT so Claude cannot call
          # `gh pr create` (that tool also matches non-draft and --admin flags).
          # branch_name stays empty in this mode, so the draft-PR step computes
          # claude/issue-<number> itself instead of reading the action output.
          prompt: |
            Implement GitHub issue #${{ github.event.issue.number }} in ${{ github.repository }}. Follow AGENTS.md.
            The issue text is in `${{ runner.temp }}/tempo-issue.md`. Read that file. Do not use gh.
            You are already on branch `claude/issue-${{ github.event.issue.number }}`, created from integration.
            Stay inside the ticket's MUTATES list (or SCOPE on older tickets).
            Do not run lint, test, or typecheck. CI runs those on the pull request.
            To commit, write a one-line message to `.tempo-commit-msg`, then run
            `/usr/local/bin/tempo-safe-git add` and `/usr/local/bin/tempo-safe-git commit`.
            Do not push. Do not open a pull request. Do not run `git`, `bun`, or `bunx` directly.
            A later workflow step pushes this branch and opens a draft pull request whose body
            contains "Closes #${{ github.event.issue.number }}".
            If you stop with a stop code before any commit, leave the tree unchanged.
          # Exact command names only. A trailing :* still matches extra argv such as
          # --force, --delete, HEAD:integration, or commit -F. The wrappers refuse
          # extra arguments, and these rules do not use :*.
          claude_args: >-
            --model claude-sonnet-5 --max-turns 40
            --setting-sources user
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(/usr/local/bin/tempo-safe-git status),Bash(/usr/local/bin/tempo-safe-git diff),Bash(/usr/local/bin/tempo-safe-git diff-cached),Bash(/usr/local/bin/tempo-safe-git log),Bash(/usr/local/bin/tempo-safe-git add),Bash(/usr/local/bin/tempo-safe-git commit)"
      - name: Open draft pull request
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git() { /usr/bin/git -c core.hooksPath=/dev/null "$@"; }
          # Rewrite .git/config through the wrapper before any later git call.
          /usr/local/bin/tempo-safe-git status >/dev/null
          case "$ISSUE" in
            ''|*[!0-9]*) echo "::error::issue number is not digits"; exit 1 ;;
          esac
          BRANCH="claude/issue-${ISSUE}"
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DISPATCH_PAT is empty; cannot open draft pull request"
            exit 1
          fi
          head=$(git rev-parse --abbrev-ref HEAD)
          ahead=$(git rev-list --count "integration..HEAD" || echo 0)
          if [ "$head" != "$BRANCH" ] || [ "$ahead" = "0" ]; then
            gh issue comment "$ISSUE" -R "$REPO" --body "Dispatch router: Claude left no commits on \`$BRANCH\`. No pull request opened."
            gh issue edit "$ISSUE" -R "$REPO" --remove-label "dispatched:claude" || true
            exit 0
          fi
          # Token stays in the environment of this one git process. It is not
          # written to .git/config and it is not printed.
          auth_push() {
            local branch="$1"
            local header
            header=$(sudo -n cat /usr/local/lib/tempo-git-extraheader)
            case "$header" in
              ''|*'['*|*']'*|*$'\n'*)
                unset header
                echo "::error::checkout credential is not usable"
                return 1
                ;;
            esac
            if GIT_CONFIG_COUNT=1 \
                GIT_CONFIG_KEY_0=http.extraheader \
                GIT_CONFIG_VALUE_0="$header" \
                /usr/bin/git \
                  -c core.hooksPath=/dev/null \
                  -c core.fsmonitor= \
                  -c core.sshCommand= \
                  push --no-verify -u origin "$branch"; then
              unset header
              return 0
            fi
            unset header
            return 1
          }
          if ! auth_push "$BRANCH"; then
            gh issue comment "$ISSUE" -R "$REPO" --body "Dispatch router: push of \`$BRANCH\` failed. Refusing to force-push. No pull request opened."
            gh issue edit "$ISSUE" -R "$REPO" --remove-label "dispatched:claude" || true
            exit 1
          fi
          EXISTING_PR="$(gh pr list --repo "$REPO" --head "$BRANCH" --base integration --state open --json url --jq 'if length == 0 then "" else .[0].url // "" end')"
          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "Existing pull request: $EXISTING_PR"
            exit 0
          fi
          gh pr create \
            --repo "$REPO" \
            --head "$BRANCH" \
            --base integration \
            --draft \
            --title "fix: implement issue #$ISSUE" \
            --body "Automated Claude implementation for issue #$ISSUE.

          Please review before marking ready. Draft so auto-merge cannot arm.

          Closes #$ISSUE"
      - name: Free the lane slot if the start failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          LANE: claude
        run: |
          gh issue edit "$ISSUE" -R "$REPO" --remove-label "dispatched:$LANE" || true
          gh issue comment "$ISSUE" -R "$REPO" --body "Dispatch router: $LANE run failed; slot freed. See the Actions run log."

  cursor:
    needs: route
    if: needs.route.outputs.lane == 'cursor'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
    steps:
      - name: Start a Cursor cloud agent (Cloud Agents API)
        id: start
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          CURSOR_MODEL_ID: ${{ vars.CURSOR_MODEL_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY:-}" ] || [ -z "${CURSOR_MODEL_ID:-}" ]; then
            gh issue comment "$ISSUE" -R "$REPO" --body "Dispatch router: cursor lane needs the CURSOR_API_KEY secret and the CURSOR_MODEL_ID variable (explicit model pin); not started."
            exit 1
          fi
          body=$(jq -n --arg repo "https://github.com/$REPO" --arg n "$ISSUE" --arg t "$TITLE" --arg model "$CURSOR_MODEL_ID" '{
            name: ("Issue #" + $n + ": " + $t)[0:100],
            prompt: {text: ("Implement GitHub issue #" + $n + " (" + $repo + "/issues/" + $n + "). Follow AGENTS.md. Stay inside the ticket MUTATES list (or SCOPE on older tickets). Open a PR into integration whose body contains Closes #" + $n + ".")},
            model: {id: $model},
            repos: [{url: $repo, startingRef: "integration"}],
            autoCreatePR: true}')
          # The key goes to curl as a config line on stdin (basic auth, empty password), so it
          # is never on the command line and no secret-scan allowlist is needed.
          resp=$(printf 'user = "%s:"\n' "$CURSOR_API_KEY" | curl -sS --fail-with-body -K - \
            -H 'Content-Type: application/json' \
            -X POST https://api.cursor.com/v1/agents --data "$body")
          echo "started=true" >> "$GITHUB_OUTPUT"
          agent=$(printf '%s' "$resp" | jq -r '.agent.id // .id // "unknown"')
          gh issue comment "$ISSUE" -R "$REPO" --body "Dispatch router: Cursor cloud agent started (id \`$agent\`)." || true
      - name: Free the lane slot if the start failed
        # Only when the agent was never created; a running agent keeps its slot.
        if: failure() && steps.start.outputs.started != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          LANE: cursor
        run: |
          gh issue edit "$ISSUE" -R "$REPO" --remove-label "dispatched:$LANE" || true
          gh issue comment "$ISSUE" -R "$REPO" --body "Dispatch router: $LANE run failed; slot freed. See the Actions run log."

  codex:
    needs: route
    if: needs.route.outputs.lane == 'codex'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
    steps:
      - name: Hand off to Codex (manual trigger)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" -R "$REPO" --body "Dispatch router: codex lane. A maintainer starts it by commenting \`@codex implement this ticket, follow AGENTS.md\` (Codex GitHub app, runs on Codex cloud with the ChatGPT plan). Starting Codex from a bot comment is not documented (UNKNOWN)."
