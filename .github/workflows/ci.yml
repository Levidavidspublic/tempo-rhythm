name: CI

# TF-34: this workflow has TEETH. No `continue-on-error`, no silent no-op
# steps. A red check means the PR is not mergeable — see docs/merge-runbook.md
# for the merge process (agents land on `integration` under three gates;
# only Amit merges `integration` into `master`).

on:
  pull_request:
    branches: [master, integration]
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge queue on integration re-runs this required check against the queue commit.
  merge_group:
    branches: [master, integration]
  workflow_dispatch:
  # release.yml (Phase H) runs this whole CI again on the exact integration SHA before a production release.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.3.9'

# Package manager is `bun` for all CI steps (per HARD_RULES §2).
# Root package.json declares `packageManager: "bun@1.3.9"` and `bun.lock` is committed.

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run typecheck
        run: bun run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run lint
        run: bun run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests (enforcing — failures block the PR)
        run: bun run test

  scan:
    name: Scans (forbidden-tech, ram-only-audit, design-tokens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # HARD_RULES §2 — forbidden dependencies/imports. Zero tolerance.
      - name: Forbidden-tech scan
        run: bun run scan:forbidden-tech

      # HARD_RULES §5 — RAM-only scanner rule + soft-delete ratchet.
      - name: RAM-only audit
        run: bun run scan:ram-only-audit

      # HARD_RULES §7 — design-token ratchet (no new one-off hex values).
      - name: Design-tokens scan
        run: bun run scan:design-tokens

  notices:
    name: Third-party notices (TF-OSS-00)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check THIRD-PARTY-NOTICES.md covers every runtime dependency
        run: bun run check:notices

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run Playwright e2e tests
        run: bunx playwright test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run build
        env:
          # Build-time placeholder only: CI never talks to a real Convex deployment.
          NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
        run: bun run build

  # Required check `ci` (Phase 03): one stable name for the ruleset. Passes only when every job
  # above (install, lint, typecheck, unit tests, build, scans, notices, local E2E) succeeded.
  ci:
    name: ci
    if: always()
    needs: [typecheck, lint, test, scan, notices, e2e, build]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed?
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
