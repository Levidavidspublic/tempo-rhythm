name: factory-lane-claude

# Phase 04 Step 5a. Claude lane: builds one ticket with anthropics/claude-code-action@v1 in
# automation mode (a `prompt` is set), on branch t/<issue-number>-<slug>, and opens ONE PR into
# integration. The PR is opened with the Claude GitHub App token the action mints (OIDC), not
# GITHUB_TOKEN, so CI runs (R15). Model: vars.FACTORY_MODEL_CLAUDE.
# Dispatched only by factory-dispatch (or factory-failures for a retry, with fix_note).
# Batch loop: factory-review-fix dispatches it with target_branch=batch/<loop-id> + fix_note to fix the
# batch PR's Bugbot findings on the batch branch (no PR). lane-context.mjs refuses any other branch shape.
# Secret CLAUDE_CODE_OAUTH_TOKEN: tempo-rhythm has a repo-level one today; the other repos need the
# org secret (not created yet). Labelling the issue needs the Factory App (FACTORY_APP_ID/PRIVATE_KEY);
# without it factory-label-pr does it when the PR opens (also parked until the App exists).

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Ticket issue number
        required: true
        type: string
      fix_note:
        description: Failure-rule retry only - last 150 lines of the failing log
        required: false
        type: string
        default: ""
      force:
        description: Run even while the factory is paused (Amit / Grok Bot one-off tests only)
        type: boolean
        default: false
      target_branch:
        description: Batch loop only - fix Bugbot findings of the batch PR directly on batch/<loop-id> (needs fix_note; no PR)
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: factory-lane-${{ inputs.target_branch || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  quiet:
    # Quiet hours (factory/LOOP.md): 22:00-09:00 Asia/Jerusalem nothing new starts; the run ends green.
    if: (vars.FACTORY_PAUSED_ALL != 'true' && vars.FACTORY_PAUSED != 'true') || (github.event_name == 'workflow_dispatch' && inputs.force == true)
    uses: ./.github/workflows/factory-quiet-hours.yml
    with:
      what: "factory-lane-claude #${{ inputs.issue_number }}"
      exempt: ${{ inputs.fix_note != '' }}
      exempt_reason: fix run for work already in flight (fix_note)
  build:
    needs: quiet
    if: needs.quiet.outputs.quiet != 'true' && ((vars.FACTORY_PAUSED_ALL != 'true' && vars.FACTORY_PAUSED != 'true') || (github.event_name == 'workflow_dispatch' && inputs.force == true))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: force=true only from a person
        if: inputs.force == true && endsWith(github.triggering_actor, '[bot]')
        run: |
          echo "::error::force=true came from a bot (${{ github.triggering_actor }}). Only Amit or Grok Bot may force a paused factory run."
          exit 1
      - name: Claude token present?
        env:
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "::error::PARKED: secret CLAUDE_CODE_OAUTH_TOKEN is not visible to this repo (org secret; repo must be in Levidavidspublic)."; exit 1; fi
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: integration
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Ticket context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          FIX_NOTE: ${{ inputs.fix_note }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: node scripts/factory/lane-context.mjs
      - name: Branch t/<issue>-<slug> (or the existing PR branch on a retry)
        env:
          BRANCH: ${{ steps.ctx.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch origin "$BRANCH" && git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -B "$BRANCH"
          fi
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        id: bun
        with:
          bun-version: '1.3.9'
          no-cache: true
      - name: Verify Bun version
        run: test "$(bun --version)" = '1.3.9'
      - uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1
        id: claude
        env:
          CLAUDE_BRANCH: ${{ steps.ctx.outputs.branch }}
        with:
          path_to_bun_executable: ${{ steps.bun.outputs.bun-path }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # factory-review-fix (batch loop step 5) dispatches with github.token -> actor github-actions[bot].
          # Without this the action refuses ("non-human actor"), which failed every auto fix run (audit 2026-10-06).
          # Only that bot (GITHUB_TOKEN-dispatched runs: factory-dispatch, factory-review-fix, factory-failures).
          # Fresh automated builds stay gated by FACTORY_ACTIVE_BATCHES (unset = factory-dispatch picks nothing).
          allowed_bots: "github-actions"
          # Batch fix runs work on (and push to) batch/<loop-id>; they get no `gh pr create` tool.
          base_branch: ${{ inputs.target_branch || 'integration' }}
          prompt: ${{ steps.ctx.outputs.prompt }}
          claude_args: >-
            --model ${{ vars.FACTORY_MODEL_CLAUDE }}
            --max-turns 60
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(bun --version),Bash(uv tool install graphifyy==0.9.74),Bash(graphify update . --no-cluster),Bash(bun install:*),Bash(bun run:*),Bash(bun test:*),Bash(bunx:*),Bash(git status:*),Bash(git diff:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git log:*)${{ inputs.target_branch == '' && ',Bash(gh pr create:*)' || '' }},Bash(gh pr view:*),Bash(gh issue view:*)"
      - name: Factory App configured?
        id: app
        if: always()
        env:
          APP_ID: ${{ secrets.FACTORY_APP_ID }}
        run: |
          if [ -n "$APP_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::PARKED: Factory App secrets missing; issue not relabelled here (factory-label-pr does it when the App exists)."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        if: always() && steps.app.outputs.ok == 'true'
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - name: Issue -> status:in-pr when the PR exists
        if: always() && steps.app.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE: ${{ inputs.issue_number }}
        run: |
          node --input-type=module -e '
            import { findTicketPR, addLabels, removeLabel } from "./scripts/factory/factory-lib.mjs";
            import { repoParts } from "./scripts/factory/gh-api.mjs";
            const { owner, repo } = repoParts(); const n = Number(process.env.ISSUE);
            const pr = await findTicketPR(owner, repo, n);
            if (!pr) { console.log("::warning::No open PR links #" + n + " yet."); process.exit(0); }
            await addLabels(owner, repo, n, ["status:in-pr"]); await removeLabel(owner, repo, n, "status:dispatched");
            console.log("PR " + pr.html_url + " -> issue #" + n + " status:in-pr");'
