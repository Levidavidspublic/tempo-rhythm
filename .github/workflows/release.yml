name: Release to production

# Phase H (2026-10-06). Amit's ONE click: Actions -> "Release to production" -> Run workflow (branch integration).
# Amit-facing guide: docs/DEPLOY.md. Script: scripts/factory/release-gate.mjs (read its header).
#
# 1. preflight  Amit-only (Division6066), from integration only. Pins the integration SHA (= github.sha) and lists
#               anything that would stop the merge (rulesets, history, merge method, missing token). A real run
#               stops here if there is a blocker; a dry run reports it and keeps going.
# 2. release-pr Opens/updates ONE Release PR integration -> master as Division6066 (FACTORY_BATCH_TOKEN), label release.
# 3. Second gate on that exact SHA: full CI (ci.yml), secret scans (security.yml), Playwright against the integration
#    Vercel preview, then ONE Cursor Bugbot review of the whole release PR. Any failure or Bugbot finding -> the
#    PR gets blocked:amit + a summary comment and the run stops. No auto-fix on release.
# 4. dry_run=true stops after the gate (nothing merged, no Convex deploy, nothing live).
# 5. Real run: waits until GitHub says the PR is mergeable, deploys Convex prod (precious-wildcat-890) only when
#    convex/ changed, merges the PR pinned to the gate SHA (Vercel then deploys tempo-web to production), waits for
#    the production deployment to succeed and checks https://www.tempoflow.dev/api/health reports the new commit.
#    Rollback is manual (docs/DEPLOY.md). Nothing here rolls back automatically.
#
# One click on purpose: no GitHub environment approval on the merge. Optional second click: docs/DEPLOY.md.
# R15: every write (PR, comment, label, merge) uses FACTORY_BATCH_TOKEN, never GITHUB_TOKEN.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: run the whole gate, but do NOT merge to master (nothing goes live)"
        type: boolean
        default: false

run-name: "Release to production${{ inputs.dry_run && ' (dry run)' || '' }} by ${{ github.triggering_actor }}"

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  statuses: read
  deployments: read
  actions: read

concurrency:
  group: release-production
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.sha }}
  DRY_RUN: ${{ inputs.dry_run }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  USER_TOKEN_SET: ${{ secrets.FACTORY_BATCH_TOKEN != '' }}
  MERGE_METHOD: ${{ vars.RELEASE_MERGE_METHOD || 'merge' }}

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      master_sha: ${{ steps.pre.outputs.master_sha }}
      convex_changed: ${{ steps.pre.outputs.convex_changed }}
      blockers: ${{ steps.pre.outputs.blockers }}
    steps:
      - name: Amit only, from integration only
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
        run: |
          if [ "$ACTOR" != "Division6066" ] || [ "$TRIGGERING_ACTOR" != "Division6066" ]; then
            echo "::error::Only Amit (Division6066) may release to production (actor=$ACTOR, triggering_actor=$TRIGGERING_ACTOR)."
            exit 1
          fi
          if [ "$REF" != "refs/heads/integration" ]; then
            echo "::error::Run this workflow from the integration branch (got $REF)."
            exit 1
          fi
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Preflight (read-only)
        id: pre
        env:
          GH_TOKEN: ${{ secrets.FACTORY_BATCH_TOKEN || github.token }}
        run: node scripts/factory/release-gate.mjs preflight

  release-pr:
    name: release PR
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      number: ${{ steps.pr.outputs.pr_number }}
      url: ${{ steps.pr.outputs.pr_url }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/factory
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Open or update the Release PR (Division6066)
        id: pr
        env:
          GH_TOKEN: ${{ secrets.FACTORY_BATCH_TOKEN || github.token }}
          MASTER_SHA: ${{ needs.preflight.outputs.master_sha }}
        run: node scripts/factory/release-gate.mjs pr

  gate-ci:
    name: gate CI
    needs: preflight
    uses: ./.github/workflows/ci.yml

  gate-security:
    name: gate secret scans
    needs: preflight
    uses: ./.github/workflows/security.yml
    with:
      base_sha: ${{ needs.preflight.outputs.master_sha }}

  gate-e2e-preview:
    name: gate E2E on preview
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Empty = the whole Playwright suite against the preview. playwright.config.ts (config PR #674) skips the
      # two local-dev-only specs when PLAYWRIGHT_BASE_URL is set; gate CI's "E2E (Playwright)" job still runs them
      # locally. Specs needing TEMPO_E2E_STORAGE_STATE skip themselves until that login state exists.
      # Repo variable RELEASE_PREVIEW_SPECS (space-separated paths) narrows the list if ever needed.
      SPECS: ${{ vars.RELEASE_PREVIEW_SPECS }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Wait for the Vercel preview of the gate SHA
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          PREVIEW_ENVIRONMENT: ${{ vars.FACTORY_PREVIEW_ENVIRONMENT }}
          PREVIEW_STATUS_CONTEXT: ${{ vars.FACTORY_PREVIEW_STATUS_CONTEXT }}
        run: node scripts/factory/wait-preview.mjs
      - name: Preview URL to test
        id: url
        env:
          URL: ${{ steps.preview.outputs.url }}
          FALLBACK: ${{ vars.RELEASE_PREVIEW_URL || 'https://preview.tempoflow.dev' }}
        run: |
          if [ -n "$URL" ]; then echo "url=$URL" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Vercel skipped this SHA (no app change since the last integration preview): the integration alias
          # serves the same app code.
          echo "url=$FALLBACK" >> "$GITHUB_OUTPUT"
          echo "Vercel skipped the build for ${GITHUB_SHA::7}; testing the integration alias $FALLBACK (same app code)." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check the bypass secret is set
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::Secret VERCEL_AUTOMATION_BYPASS_SECRET is missing: the protected preview can't be tested."
            exit 1
          fi
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.9'
      - name: Install dependencies and Chromium
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Playwright against the preview
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.url.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CI: 'true'
        run: |
          # SPECS is a space-separated list of paths (word splitting intended).
          # shellcheck disable=SC2086
          bunx playwright test $SPECS --reporter=list,html
      - name: Upload screenshots, traces and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-e2e-preview-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 30

  bugbot:
    name: gate Bugbot (one review)
    # Bugbot costs money: ask for it only after CI, scans and preview E2E are green.
    needs: [preflight, release-pr, gate-ci, gate-security, gate-e2e-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      detail: ${{ steps.bb.outputs.detail }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/factory
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: One Cursor Bugbot review of the release PR
        id: bb
        env:
          GH_TOKEN: ${{ secrets.FACTORY_BATCH_TOKEN || github.token }}
          PR_NUMBER: ${{ needs.release-pr.outputs.number }}
          BUGBOT_WAIT_AUTO_SECONDS: "60"
          BUGBOT_WAIT_MINUTES: "35"
        run: node scripts/factory/release-gate.mjs bugbot

  verdict:
    name: gate verdict
    needs: [preflight, release-pr, gate-ci, gate-security, gate-e2e-preview, bugbot]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/factory
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: All gates green?
        env:
          GH_TOKEN: ${{ secrets.FACTORY_BATCH_TOKEN || github.token }}
          PR_NUMBER: ${{ needs.release-pr.outputs.number }}
          CONVEX_CHANGED: ${{ needs.preflight.outputs.convex_changed }}
          PREFLIGHT_BLOCKERS: ${{ needs.preflight.outputs.blockers }}
          RESULTS: >-
            {"release PR": "${{ needs.release-pr.result }}",
             "CI (lint, typecheck, unit, scans, notices, local E2E, build)": "${{ needs.gate-ci.result }}",
             "secret scans": "${{ needs.gate-security.result }}",
             "Playwright on the integration preview": "${{ needs.gate-e2e-preview.result }}",
             "Cursor Bugbot": "${{ needs.bugbot.result }}"}
        run: node scripts/factory/release-gate.mjs verdict

  pr-ready:
    name: release PR mergeable
    needs: [preflight, release-pr, verdict]
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/factory
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Wait for the release PR's required checks
        env:
          GH_TOKEN: ${{ secrets.FACTORY_BATCH_TOKEN }}
          PR_NUMBER: ${{ needs.release-pr.outputs.number }}
          MASTER_SHA: ${{ needs.preflight.outputs.master_sha }}
          CHECKS_WAIT_MINUTES: "60"
        run: node scripts/factory/release-gate.mjs pr-ready

  convex-prod:
    name: Convex prod deploy (precious-wildcat-890)
    needs: [preflight, pr-ready]
    if: inputs.dry_run != true && needs.preflight.outputs.convex_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The live Convex key lives on this environment (same convention as deploy-live.yml).
    environment: Production
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Refuse anything but the prod deploy key (value never printed)
        env:
          CONVEX_DEPLOY_KEY_LIVE: ${{ secrets.CONVEX_DEPLOY_KEY_LIVE }}
        run: node scripts/factory/release-gate.mjs convex-key
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.9'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Deploy Convex functions to precious-wildcat-890
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_LIVE }}
        run: npx convex deploy

  ship:
    name: merge + verify production
    needs: [preflight, release-pr, pr-ready, convex-prod]
    if: >-
      always() && inputs.dry_run != true && needs.pr-ready.result == 'success' &&
      (needs.convex-prod.result == 'success' || needs.convex-prod.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/factory
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Merge the release PR, wait for Vercel production, check /api/health
        env:
          GH_TOKEN: ${{ secrets.FACTORY_BATCH_TOKEN }}
          PR_NUMBER: ${{ needs.release-pr.outputs.number }}
          PROD_ENVIRONMENT: ${{ vars.RELEASE_PRODUCTION_ENVIRONMENT || 'Production' }}
          HEALTH_URL: ${{ vars.RELEASE_HEALTH_URL || 'https://www.tempoflow.dev/api/health' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DEPLOY_WAIT_MINUTES: "30"
        run: node scripts/factory/release-gate.mjs ship
