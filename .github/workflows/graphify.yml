name: Graphify

# Rebuild the code knowledge graph on every push to integration (merge-queue / auto-merge merges are pushes too).
# graphifyy 0.9.74: `graphify update . --no-cluster` is local tree-sitter AST. No API key, no secrets.
# Not a required check. Do not add it to a ruleset.
#
# Output: Actions artifact `graphify-graph` (graphify-out/graph.json, 14 days) + a job summary with the download command.
# Not committed: graph.json is ~7 MB and changes on almost every push; committing it would bloat history.
# docs/graph/README.md is the stable path: it says where the graph lives and how to rebuild or download it.
#
# Pause (Run Book v5 B4): same check as every factory workflow. Paused = push runs skip.
# workflow_dispatch with force=true runs anyway, from a person only (Amit / Grok Bot), never a bot.

on:
  push:
    branches: [integration]
  workflow_dispatch:
    inputs:
      force:
        description: Run even while the factory is paused (Amit / Grok Bot one-off only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: graphify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild-graph:
    name: Rebuild graph
    if: (vars.FACTORY_PAUSED_ALL != 'true' && vars.FACTORY_PAUSED != 'true') || (github.event_name == 'workflow_dispatch' && inputs.force == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: force=true only from a person
        if: github.event_name == 'workflow_dispatch' && inputs.force == true && endsWith(github.triggering_actor, '[bot]')
        run: |
          echo "::error::force=true came from a bot (${{ github.triggering_actor }}). Only Amit or Grok Bot may force a paused factory run."
          exit 1

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install Graphify 0.9.74
        run: |
          set -euo pipefail
          uv tool install "graphifyy==0.9.74"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/graphify" --version | grep -qx 'graphify 0.9.74'

      - name: Rebuild code graph (local AST, no API key)
        run: |
          set -euo pipefail
          graphify update . --no-cluster
          test -s graphify-out/graph.json

      - name: Upload graph artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graphify-graph
          path: graphify-out/graph.json
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        run: |
          {
            echo "### Graphify graph (graphifyy 0.9.74) for ${GITHUB_SHA::7}"
            echo "Artifact \`graphify-graph\` ($(du -h graphify-out/graph.json | cut -f1)). Download:"
            echo '```'
            echo "gh run download ${GITHUB_RUN_ID} -R ${GITHUB_REPOSITORY} -n graphify-graph -D graphify-out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
