name: factory-lane-codex

# Phase 04 Step 5b. Codex lane. Mode = vars.FACTORY_CODEX_MODE: pr (default) | issue (legacy) | manual.
# pr: github.token creates t/<issue>-<slug> from integration with one empty commit (a ref, not a PR),
# then the CODEX_MENTION_PAT user (Issues + Pull requests write) opens a DRAFT PR "Closes #<issue>"
# and posts "@codex implement ..." ON THE PR. Codex ignores @codex on issues (tested 2026-10-06).
# No Factory App. Codex's model comes from Codex settings (vars.FACTORY_MODEL_CODEX is a record).
# Never an OpenAI API key / openai/codex-action (R4). Script: scripts/factory/codex-lane.mjs.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Ticket issue number
        required: true
        type: string
      fix_note:
        description: Failure-rule retry only - last 150 lines of the failing log
        required: false
        type: string
        default: ""
      force:
        description: Run even while the factory is paused (Amit / Grok Bot one-off tests only)
        type: boolean
        default: false

permissions:
  contents: write # mode pr: create the t/<issue>-<slug> branch + empty commit only (PR + comments use CODEX_MENTION_PAT)
  issues: read
  pull-requests: read

concurrency:
  group: factory-lane-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  quiet:
    # Quiet hours (factory/LOOP.md): 22:00-09:00 Asia/Jerusalem nothing new starts; the run ends green.
    if: (vars.FACTORY_PAUSED_ALL != 'true' && vars.FACTORY_PAUSED != 'true') || (github.event_name == 'workflow_dispatch' && inputs.force == true)
    uses: ./.github/workflows/factory-quiet-hours.yml
    with:
      what: "factory-lane-codex #${{ inputs.issue_number }}"
      exempt: ${{ inputs.fix_note != '' }}
      exempt_reason: fix run for work already in flight (fix_note)
  mention:
    needs: quiet
    if: needs.quiet.outputs.quiet != 'true' && ((vars.FACTORY_PAUSED_ALL != 'true' && vars.FACTORY_PAUSED != 'true') || (github.event_name == 'workflow_dispatch' && inputs.force == true))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: force=true only from a person
        if: inputs.force == true && endsWith(github.triggering_actor, '[bot]')
        run: |
          echo "::error::force=true came from a bot (${{ github.triggering_actor }}). Only Amit or Grok Bot may force a paused factory run."
          exit 1
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: integration
          sparse-checkout: |
            scripts/factory
            .github/factory
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Post the @codex comment
        env:
          GH_TOKEN: ${{ github.token }}
          MENTION_TOKEN: ${{ secrets.CODEX_MENTION_PAT }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          FIX_NOTE: ${{ inputs.fix_note }}
          CODEX_MODE: ${{ vars.FACTORY_CODEX_MODE || 'pr' }}
        run: node scripts/factory/codex-lane.mjs
