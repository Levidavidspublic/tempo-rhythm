# .github/workflows/agent-router.yml
#
# GitHub Issues are the tickets. This workflow is the dispatcher. No Linear, no Cyrus.
#
# TWO WAYS TO PUSH A TICKET:
#   1. Put a label on the issue:  agent:claude  |  agent:cursor  |  agent:codex
#   2. Or fire it by hand:  gh workflow run agent-router.yml -f agent=cursor -f issue=42
#
# 🔴 THE ONE FACT THIS WHOLE FILE IS BUILT ON:
#   Cursor DELIBERATELY IGNORES comments authored by bots, GITHUB_TOKEN included.
#   Cursor staff, forum.cursor.com/t/148135: "Comments from bots (including GitHub
#   Actions) may be intentionally filtered for security reasons." Their own fix:
#   post with a PAT so the comment comes from a real user.
#   claude-code-action rejects bot actors too. Assume Codex does the same.
#   => every @mention below is posted with DISPATCH_PAT, never GITHUB_TOKEN.
#
# SECRETS
#   DISPATCH_PAT               fine-grained PAT, issues:write on these repos. THE critical one.
#   CLAUDE_CODE_OAUTH_TOKEN    from `claude setup-token` -> runs bill to Claude Max, not API.

name: Agent Router

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      agent:
        description: "Who takes it"
        required: true
        type: choice
        options: [claude, cursor, codex]
      issue:
        description: "Issue number"
        required: true
        type: string
      base:
        description: "Base branch"
        required: false
        default: integration
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  quiet:
    # Quiet hours (factory/LOOP.md): 22:00-09:00 Asia/Jerusalem nothing new starts; the run ends green.
    # Only agent:* labels / manual runs (other label events never pick an agent anyway).
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.label.name, 'agent:')
    uses: ./.github/workflows/factory-quiet-hours.yml
    with:
      what: "agent-router (lane start)"
  route:
    needs: quiet
    if: needs.quiet.outputs.quiet != 'true' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.label.name, 'agent:'))
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.pick.outputs.agent }}
      issue: ${{ steps.pick.outputs.issue }}
      base: ${{ steps.pick.outputs.base }}
    steps:
      - name: Checkout lane-limits script (default branch, no credentials)
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          sparse-checkout: scripts/factory
          persist-credentials: false
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SENDER: ${{ github.event.sender.login }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_AGENT: ${{ inputs.agent }}
          INPUT_ISSUE: ${{ inputs.issue }}
          INPUT_BASE: ${{ inputs.base }}
          LABEL_NAME: ${{ github.event.label.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # Usage limits + preference (scripts/factory/lane-limits.mjs, docs/factory/AGENT-LIMITS.md).
          FACTORY_CLAUDE_AT_LIMIT: ${{ vars.FACTORY_CLAUDE_AT_LIMIT }}
          FACTORY_CODEX_AT_LIMIT: ${{ vars.FACTORY_CODEX_AT_LIMIT }}
          FACTORY_CURSOR_AT_LIMIT: ${{ vars.FACTORY_CURSOR_AT_LIMIT }}
          FACTORY_AGENT_PREFERENCE: ${{ vars.FACTORY_AGENT_PREFERENCE }}
        run: |
          set -euo pipefail
          # Label and workflow_dispatch both spend a write token. Triage and
          # read collaborators must not be able to start an agent.
          perm=$(gh api "repos/$REPO/collaborators/$SENDER/permission" --jq .permission 2>/dev/null || echo none)
          case "$perm" in
            admin|maintain|write) ;;
            *)
              echo "agent=" >> "$GITHUB_OUTPUT"
              echo "issue=" >> "$GITHUB_OUTPUT"
              echo "Sender ${SENDER:-unknown} has permission $perm; agent router requires write."
              exit 0
              ;;
          esac
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            AGENT="$INPUT_AGENT"
            ISSUE="$INPUT_ISSUE"
          else
            case "$LABEL_NAME" in
              agent:claude|agent:cursor|agent:codex) AGENT="${LABEL_NAME#agent:}" ;;
              *) echo "not an agent label, stopping"; exit 0 ;;
            esac
            ISSUE="$ISSUE_NUMBER"
          fi
          case "$AGENT" in
            claude|cursor|codex) ;;
            *) echo "::error::agent must be claude, cursor, or codex"; exit 1 ;;
          esac
          case "$ISSUE" in
            ''|*[!0-9]*) echo "::error::issue must be digits"; exit 1 ;;
          esac
          # Usage limits: an agent at its limit (FACTORY_*_AT_LIMIT) gets nothing new; fall back in FACTORY_AGENT_PREFERENCE
          # order; claude, codex and cursor all at their limit -> Freebuff, then OpenCode (manual run, labels only), then
          # blocked:amit. Never a pay-per-use agent.
          res=$(node scripts/factory/lane-limits.mjs --want "$AGENT")
          new_lane=$(printf '%s\n' "$res" | sed -n 's/^lane=//p')
          manual=$(printf '%s\n' "$res" | sed -n 's/^manual=//p')
          add_labels=$(printf '%s\n' "$res" | sed -n 's/^labels=//p')
          reason=$(printf '%s\n' "$res" | sed -n 's/^reason=//p')
          if [ "$manual" = true ] || [ -z "$new_lane" ]; then
            IFS=, read -ra fl <<< "$add_labels"
            for l in "${fl[@]}"; do gh label create "$l" -R "$REPO" --color FBCA04 --force >/dev/null; gh issue edit "$ISSUE" -R "$REPO" --add-label "$l"; done
            gh issue comment "$ISSUE" -R "$REPO" --body "Agent router: $reason. Nothing started; see docs/factory/AGENT-LIMITS.md."
            echo "::notice title=Usage limits::#$ISSUE -> $add_labels"
            echo "agent=" >> "$GITHUB_OUTPUT"
            echo "issue=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$new_lane" != "$AGENT" ]; then
            gh issue comment "$ISSUE" -R "$REPO" --body "Agent router: $reason (usage limits; docs/factory/AGENT-LIMITS.md)."
            AGENT="$new_lane"
          fi
          BASE="${INPUT_BASE:-integration}"
          case "$BASE" in
            master|main|*/master|*/main)
              echo "::error::Agents branch from integration. master is yours."
              exit 1
              ;;
            ''|-*|*..*|*:*|*[!A-Za-z0-9._/-]*)
              echo "::error::base branch is not allowed"
              exit 1
              ;;
          esac
          # Values are charset-checked above, so a newline cannot inject another output.
          printf 'agent=%s\n' "$AGENT" >> "$GITHUB_OUTPUT"
          printf 'issue=%s\n' "$ISSUE" >> "$GITHUB_OUTPUT"
          printf 'base=%s\n' "$BASE" >> "$GITHUB_OUTPUT"

  # ── CLAUDE: runs right here in Actions, on the Max subscription ──────────────
  claude:
    needs: route
    if: needs.route.outputs.agent == 'claude'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: claude-issue-${{ needs.route.outputs.issue }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.route.outputs.base }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.9 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install command wrappers and create the agent branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.route.outputs.issue }}
        run: |
          set -euo pipefail
          git() { /usr/bin/git -c core.hooksPath=/dev/null "$@"; }
          case "$ISSUE" in
            ''|*[!0-9]*) echo "::error::issue number is not digits"; exit 1 ;;
          esac
          # Wrappers live on integration. master does not have them until Amit
          # merges, and a workflow_dispatch base can rewrite the checkout scripts.
          TRUSTED_REF=integration
          case "$TRUSTED_REF" in
            ''|-*|*..*|*:*|*[!A-Za-z0-9._/-]*) echo "::error::trusted ref is not allowed"; exit 1 ;;
          esac
          git fetch --depth=1 origin "$TRUSTED_REF"
          # Install as root and drop the write bit. A scratch-file symlink must
          # not be able to replace these, and the model must not be able to
          # write over them either. rm removes a symlink; it does not follow it.
          sudo -n mkdir -p /usr/local/bin /usr/local/lib
          for tool in tempo-safe-git tempo-safe-bun tempo-write-scratch; do
            sudo -n rm -f "/usr/local/bin/${tool}"
            git show "origin/${TRUSTED_REF}:.github/scripts/${tool}" | sudo -n tee "/usr/local/bin/${tool}" >/dev/null
            sudo -n chown root:root "/usr/local/bin/${tool}"
            sudo -n chmod 0555 "/usr/local/bin/${tool}"
            sudo -n chattr +i "/usr/local/bin/${tool}" || true
          done
          case "$REPO" in
            [A-Za-z0-9._-]*/[A-Za-z0-9._-]*) ;;
            *) echo "::error::repository name is not allowed"; exit 1 ;;
          esac
          printf '%s\n' "https://github.com/${REPO}.git" | sudo -n tee /usr/local/lib/tempo-git-origin >/dev/null
          # checkout@v6 keeps the token in an included file as a URL-scoped
          # extraheader. A local get of the unscoped key misses it.
          # --get-urlmatch follows that include. Do not print the value.
          header=$(git config --get-urlmatch http.extraheader "https://github.com/${REPO}.git" || true)
          case "$header" in
            *'['*|*']'*|*$'\n'*) echo "::error::http.extraheader is not a single safe line"; exit 1 ;;
          esac
          if [ -z "$header" ]; then
            echo "::error::checkout credential was not found"
            exit 1
          fi
          printf '%s' "$header" | sudo -n tee /usr/local/lib/tempo-git-extraheader >/dev/null
          sudo -n chown root:root /usr/local/lib/tempo-git-origin /usr/local/lib/tempo-git-extraheader
          sudo -n chmod 0444 /usr/local/lib/tempo-git-origin
          # 0400 root: the model can Read a 0444 file. The workflow push step
          # reads this with sudo after the model has exited. Do not print it.
          sudo -n chmod 0400 /usr/local/lib/tempo-git-extraheader
          sudo -n chattr +i /usr/local/lib/tempo-git-origin /usr/local/lib/tempo-git-extraheader || true
          unset header
          BRANCH="claude/issue-${ISSUE}"
          git fetch --depth=1 origin "$BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}"; then
            git checkout -B "$BRANCH" "origin/${BRANCH}"
          else
            git checkout -b "$BRANCH"
          fi
          # Write after checkout, outside the work tree. rm -f only drops a
          # leftover in-repo symlink; the body goes through tempo-write-scratch
          # (O_NOFOLLOW|O_EXCL) so a recreated symlink is not followed.
          rm -f .tempo-issue.md
          gh issue view "$ISSUE" --repo "$REPO" --comments | /usr/local/bin/tempo-write-scratch "${RUNNER_TEMP}/tempo-issue.md"
          # Checkout's includeIf file is still runner-readable. Lock it, then
          # drop includeIf from .git/config before the model starts.
          # checkout@v6 writes a host includeIf for the gitdir AND one for
          # gitdir/worktrees/*, both pointing at the same credentials file.
          # Lock each file once: after chattr +i, a second chown gets EPERM.
          locked=' '
          while read -r _key path; do
            [ -n "${path:-}" ] || continue
            case "$locked" in *" ${path} "*) continue ;; esac
            # checkout@v6 also records /github/runner_temp/... for container
            # jobs. That path is absent on the host runner. Skip it. An
            # existing file outside the temp dirs still fails the step.
            if [ ! -e "$path" ]; then
              continue
            fi
            case "$path" in
              "${RUNNER_TEMP:-/tmp}"/*|/home/runner/*|/tmp/*|/github/runner_temp/*) ;;
              *) echo "::error::refusing to lock unexpected credential path"; exit 1 ;;
            esac
            if [ -f "$path" ] && [ ! -L "$path" ]; then
              sudo -n chown root:root "$path"
              sudo -n chmod 0400 "$path"
              sudo -n chattr +i "$path" || true
              locked="${locked}${path} "
            fi
          done < <(git config --local --get-regexp '^includeIf\.' || true)
          /usr/local/bin/tempo-safe-git status >/dev/null
      - id: claude_code
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: ${{ needs.route.outputs.base }}
          # No track_progress: tag mode prepends Bash(git add:*), Bash(git commit:*),
          # Bash(git rm:*), and a git-push helper. Those prefixes are unioned with
          # claude_args, so the wrapper list would not replace them.
          additional_permissions: |
            actions: read
          prompt: |
            The issue text is in `${{ runner.temp }}/tempo-issue.md`. Read that file and implement the work it asks for.
            You are already on branch `claude/issue-${{ needs.route.outputs.issue }}`, created from `${{ needs.route.outputs.base }}`.
            Do not push and do not open a pull request. A later step pushes this branch and opens the draft.
            Stay inside the file scope the issue declares. If the work needs a file outside that scope,
            stop and explain it in the pull request instead of widening scope. Never touch master.
            Do not run lint, test, or typecheck. CI runs those on the pull request.
            To commit, write `.tempo-commit-msg`, then run
            `/usr/local/bin/tempo-safe-git add` and `/usr/local/bin/tempo-safe-git commit`.
            Do not run `git`, `bun`, or `bunx` directly.
          claude_args: |
            --max-turns 40
            --model claude-sonnet-5
            --setting-sources user
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(/usr/local/bin/tempo-safe-git status),Bash(/usr/local/bin/tempo-safe-git diff),Bash(/usr/local/bin/tempo-safe-git diff-cached),Bash(/usr/local/bin/tempo-safe-git log),Bash(/usr/local/bin/tempo-safe-git add),Bash(/usr/local/bin/tempo-safe-git commit)"

      - name: Open draft pull request
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
          BASE: ${{ needs.route.outputs.base }}
          ISSUE: ${{ needs.route.outputs.issue }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git() { /usr/bin/git -c core.hooksPath=/dev/null "$@"; }
          # Rewrite .git/config through the wrapper before any later git call.
          /usr/local/bin/tempo-safe-git status >/dev/null
          case "$ISSUE" in
            ''|*[!0-9]*) echo "::error::issue number is not digits"; exit 1 ;;
          esac
          case "$BASE" in
            master|main|*/master|*/main|''|-*|*..*|*:*|*[!A-Za-z0-9._/-]*)
              echo "::error::base branch is not allowed"
              exit 1
              ;;
          esac
          BRANCH="claude/issue-${ISSUE}"
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DISPATCH_PAT is empty; cannot open draft pull request"
            exit 1
          fi
          head=$(git rev-parse --abbrev-ref HEAD)
          ahead=$(git rev-list --count "${BASE}..HEAD" || echo 0)
          if [ "$head" != "$BRANCH" ] || [ "$ahead" = "0" ]; then
            echo "No commits on $BRANCH; not opening a pull request."
            exit 0
          fi
          # Token stays in the environment of this one git process. It is not
          # written to .git/config and it is not printed.
          auth_push() {
            local branch="$1"
            local header
            header=$(sudo -n cat /usr/local/lib/tempo-git-extraheader)
            case "$header" in
              ''|*'['*|*']'*|*$'\n'*)
                unset header
                echo "::error::checkout credential is not usable"
                return 1
                ;;
            esac
            if GIT_CONFIG_COUNT=1 \
                GIT_CONFIG_KEY_0=http.extraheader \
                GIT_CONFIG_VALUE_0="$header" \
                /usr/bin/git \
                  -c core.hooksPath=/dev/null \
                  -c core.fsmonitor= \
                  -c core.sshCommand= \
                  push --no-verify -u origin "$branch"; then
              unset header
              return 0
            fi
            unset header
            return 1
          }
          if ! auth_push "$BRANCH"; then
            echo "::error::Push of $BRANCH failed. Refusing to force-push."
            exit 1
          fi
          EXISTING_PR="$(gh pr list --repo "$REPO" --head "$BRANCH" --base "$BASE" --state open --json url --jq 'if length == 0 then "" else .[0].url // "" end')"
          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "Existing pull request: $EXISTING_PR"
            exit 0
          fi
          BODY="Automated Claude implementation for issue #$ISSUE.

          Please review before marking ready.

          Closes #$ISSUE"
          gh pr create \
            --repo "$REPO" \
            --head "$BRANCH" \
            --base "$BASE" \
            --draft \
            --title "fix: implement issue #$ISSUE" \
            --body "$BODY"

  # ── CURSOR + CODEX: mention them, as a real user, so their own app picks it up ──
  mention:
    needs: route
    if: needs.route.outputs.agent == 'cursor' || needs.route.outputs.agent == 'codex'
    runs-on: ubuntu-latest
    steps:
      - name: Hand the ticket over
        env:
          # NOT GITHUB_TOKEN. A bot-authored comment gets filtered and nothing happens.
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
          AGENT: ${{ needs.route.outputs.agent }}
          ISSUE: ${{ needs.route.outputs.issue }}
          BASE: ${{ needs.route.outputs.base }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "@$AGENT Please implement this issue.

          Branch from \`$BASE\` and open a pull request back into \`$BASE\`. Stay inside the file scope
          this issue declares — if the work needs a file outside it, say so in the PR instead of widening
          the scope. Do not touch \`master\`."

      - name: Mark it dispatched
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
          AGENT: ${{ needs.route.outputs.agent }}
          ISSUE: ${{ needs.route.outputs.issue }}
          REPO: ${{ github.repository }}
        run: |
          gh issue edit "$ISSUE" --repo "$REPO" \
            --add-label "dispatched:${AGENT}" || true
