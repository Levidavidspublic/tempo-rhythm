name: Security

# TF-34 (Q4a): secret scanning on every PR. Two independent scanners:
# gitleaks (rule-based) and trufflehog (verified-credential detection).
# A detected secret fails the job — no continue-on-error here, ever.

on:
  pull_request:
    branches: [master, integration]
    types: [opened, synchronize, reopened, ready_for_review]
  # Required check name is the job `secret-scan`. The queue must be able to run it.
  merge_group:
    branches: [master, integration]
  push:
    branches: [master, integration]
  workflow_dispatch:
  # release.yml (Phase H) re-runs the scans on the exact integration SHA; base_sha = master tip (scan range).
  workflow_call:
    inputs:
      base_sha:
        description: Scan commits after this SHA (release.yml passes the master tip)
        type: string
        required: false
        default: ""

concurrency:
  # event_name keeps release.yml's call (event workflow_dispatch, ref integration) from cancelling, or being
  # cancelled by, the push run on integration.
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks CLI (MIT), not gitleaks/gitleaks-action: the action needs a paid licence for
      # organisation accounts. Scans the commits this PR (or push) adds, like the action did.
      - name: Install gitleaks binary
        env:
          GITLEAKS_VERSION: v8.24.3
          # From gitleaks_8.24.3_checksums.txt on the v8.24.3 GitHub release.
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/${archive}"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl -sSfL "$url" -o "$tmpdir/$archive"
          echo "${GITLEAKS_SHA256}  $tmpdir/$archive" | sha256sum -c -
          tar -xzf "$tmpdir/$archive" -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run gitleaks on the new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="-1 $HEAD"
          else
            range="$BASE..$HEAD"
          fi
          echo "Scanning: $range"
          gitleaks git --log-opts="--no-merges $range" --redact --verbose --exit-code 1 .

  trufflehog:
    name: Secret scan (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run trufflehog (verified + unknown results only)
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          path: ./
          extra_args: --results=verified,unknown

  secret-scan-self-test:
    name: Secret scan self-test (fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - name: Install gitleaks binary
        env:
          GITLEAKS_VERSION: v8.24.3
          # From gitleaks_8.24.3_checksums.txt on the v8.24.3 GitHub release.
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/${archive}"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl -sSfL "$url" -o "$tmpdir/$archive"
          echo "${GITLEAKS_SHA256}  $tmpdir/$archive" | sha256sum -c -
          tar -xzf "$tmpdir/$archive" -C /usr/local/bin gitleaks
          gitleaks version
      - name: Prove the scanner catches a canary secret
        run: bun run secret-scan:test-fixture

  # Required check `secret-scan` (Phase 03): one stable name for the ruleset. Passes only when
  # all three scanners above passed.
  secret-scan:
    name: secret-scan
    if: always()
    needs: [gitleaks, trufflehog, secret-scan-self-test]
    runs-on: ubuntu-latest
    steps:
      - name: All secret scans passed?
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
